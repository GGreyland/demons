<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Охота на Демонов</title>
    <style>
        :root {
            --primary-color: #ff3333;
            --bg-overlay: rgba(20, 5, 5, 0.85);
            --cell-size: 45px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        .header {
            background: var(--bg-overlay);
            padding: 20px 40px;
            border-bottom: 2px solid var(--primary-color);
            border-radius: 0 0 15px 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px var(--primary-color);
            width: 500px;
        }

        h1 {
            margin: 0 0 15px 0;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff0000;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #551111;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            gap: 2px;
            background: #000;
            padding: 4px;
            border: 3px solid #551111;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }

        .cell {
            background: rgba(40, 10, 10, 0.8);
            border: 1px solid #441111;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell:hover:not(.hit):not(.miss) {
            background: rgba(100, 20, 20, 0.8);
            box-shadow: inset 0 0 10px var(--primary-color);
        }

        .cell.seal {
            background: rgba(80, 0, 0, 0.9);
            box-shadow: inset 0 0 15px #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        .cell.hit {
            background: rgba(255, 50, 0, 0.3);
            animation: shake 0.4s ease-in-out;
            border-color: #ffaa00;
            box-shadow: inset 0 0 20px #ffaa00;
            cursor: default;
        }

        .cell.miss {
            background: rgba(30, 30, 30, 0.9);
            color: #555;
            cursor: default;
        }

        .cell.revealed-demon {
            background: rgba(100, 0, 0, 0.5);
            opacity: 0.5;
            cursor: default;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            gap: 20px;
        }

        button {
            background: #330000;
            color: #ffdddd;
            border: 2px solid var(--primary-color);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        button:hover:not(:disabled) {
            background: var(--primary-color);
            color: #000;
            box-shadow: 0 0 20px var(--primary-color);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            background: #222;
            cursor: not-allowed;
            box-shadow: none;
        }

        #message {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px #000;
            height: 25px;
        }

        @keyframes shake {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Охота на Демонов</h1>
        <div class="stats">
            <div class="stat-box">Раунд: <span id="round">1</span> / 3</div>
            <div class="stat-box" style="color: #ffaa00;">Поймано: <span id="caught">0</span> / 20</div>
            <div class="stat-box">Печатей: <span id="traps">25</span></div>
        </div>
    </div>

    <div class="board" id="board"></div>

    <div id="message">Раунд 1. Расставь демонические печати...</div>

    <div class="controls">
        <button id="checkBtn" onclick="checkTraps()">Проверить!</button>
        <button id="restartBtn" onclick="initGame()" style="display: none;">Новая игра</button>
    </div>

    <script>
        const boardSize = 10;
        let board = []; // Состояния: 0 - пусто, 1 - демон, 2 - убит, 3 - промах
        
        let availableTraps = 25;
        let roundTraps = []; // Индексы печатей, поставленных в ТЕКУЩЕМ раунде
        let currentRound = 1;
        let demonsCaught = 0;
        const totalDemons = 20; // Сумма всех клеток демонов (4+3+3+2+2+2+1+1+1+1)
        let isGameOver = false;
        
        const demonSizes = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];

        const boardElement = document.getElementById('board');
        const trapsElement = document.getElementById('traps');
        const caughtElement = document.getElementById('caught');
        const roundElement = document.getElementById('round');
        const messageElement = document.getElementById('message');
        const checkBtn = document.getElementById('checkBtn');
        const restartBtn = document.getElementById('restartBtn');

        function initGame() {
            board = Array(boardSize * boardSize).fill(0);
            availableTraps = 25;
            roundTraps = [];
            currentRound = 1;
            demonsCaught = 0;
            isGameOver = false;
            
            updateUI();
            messageElement.innerText = "Раунд 1. Расставь демонические печати...";
            messageElement.style.color = "#fff";
            
            checkBtn.style.display = "block";
            checkBtn.innerText = "Проверить!";
            checkBtn.disabled = true;
            restartBtn.style.display = "none";
            
            boardElement.innerHTML = '';
            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => toggleTrap(i));
                boardElement.appendChild(cell);
            }

            placeDemons();
        }

        function canPlace(index, size, isHorizontal) {
            let row = Math.floor(index / boardSize);
            let col = index % boardSize;

            if (isHorizontal && col + size > boardSize) return false;
            if (!isHorizontal && row + size > boardSize) return false;

            for (let i = 0; i < size; i++) {
                let r = row + (isHorizontal ? 0 : i);
                let c = col + (isHorizontal ? i : 0);

                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < boardSize && nc >= 0 && nc < boardSize) {
                            if (board[nr * boardSize + nc] === 1) return false;
                        }
                    }
                }
            }
            return true;
        }

        function placeDemons() {
            demonSizes.forEach(size => {
                let placed = false;
                while (!placed) {
                    let isHorizontal = Math.random() > 0.5;
                    let index = Math.floor(Math.random() * (boardSize * boardSize));
                    
                    if (canPlace(index, size, isHorizontal)) {
                        let row = Math.floor(index / boardSize);
                        let col = index % boardSize;
                        for (let i = 0; i < size; i++) {
                            let r = row + (isHorizontal ? 0 : i);
                            let c = col + (isHorizontal ? i : 0);
                            board[r * boardSize + c] = 1;
                        }
                        placed = true;
                    }
                }
            });
        }

        // Ставим или убираем печать в ТЕКУЩЕМ раунде
        function toggleTrap(index) {
            if (isGameOver) return;
            // Нельзя ставить на уже проверенные клетки
            if (board[index] === 2 || board[index] === 3) return;

            const cell = boardElement.children[index];
            const trapIndex = roundTraps.indexOf(index);

            if (trapIndex > -1) {
                // Убираем неиспользованную печать
                roundTraps.splice(trapIndex, 1);
                availableTraps++;
                cell.classList.remove('seal');
                cell.innerText = "";
            } else {
                // Ставим печать, если они еще есть
                if (availableTraps > 0) {
                    roundTraps.push(index);
                    availableTraps--;
                    cell.classList.add('seal');
                    cell.innerText = "⛧";
                } else {
                    messageElement.innerText = "У тебя больше нет печатей!";
                    messageElement.style.color = "red";
                    setTimeout(() => {
                        if(!isGameOver) {
                            messageElement.innerText = `Раунд ${currentRound}. Жми "Проверить!"`;
                            messageElement.style.color = "#fff";
                        }
                    }, 1500);
                }
            }

            updateUI();
            checkBtn.disabled = roundTraps.length === 0;
        }

        // Проверка поставленных печатей
        function checkTraps() {
            if (isGameOver || roundTraps.length === 0) return;
            
            let hitsThisRound = 0;

            // Обрабатываем только те печати, которые поставили в этом раунде
            roundTraps.forEach(index => {
                const cell = boardElement.children[index];
                if (board[index] === 1) {
                    board[index] = 2; // Убит
                    cell.classList.remove('seal');
                    cell.classList.add('hit');
                    cell.innerText = "👹";
                    demonsCaught++;
                    hitsThisRound++;
                } else {
                    board[index] = 3; // Промах
                    cell.classList.remove('seal');
                    cell.classList.add('miss');
                    cell.innerText = "💨";
                }
            });

            // Очищаем массив текущего раунда
            roundTraps = [];
            currentRound++;
            updateUI();

            // Проверяем условия окончания игры
            if (demonsCaught === totalDemons) {
                endGame("Победа! Все демоны изгнаны досрочно!", "#00ff00");
            } else if (currentRound > 3) {
                endGame(`Игра окончена! Ты поймал ${demonsCaught} из ${totalDemons} демонов.`, "#ffaa00");
            } else if (availableTraps === 0) {
                endGame(`Печати закончились! Ты поймал ${demonsCaught} из ${totalDemons}.`, "#ffaa00");
            } else {
                // Переход к следующему раунду
                messageElement.innerText = `Попаданий: ${hitsThisRound}. Раунд ${currentRound}. Ставь еще!`;
                messageElement.style.color = hitsThisRound > 0 ? "#ffaa00" : "#888";
                checkBtn.disabled = true; // Отключаем кнопку, пока не поставят новые
            }
        }

        function endGame(message, color) {
            isGameOver = true;
            messageElement.innerText = message;
            messageElement.style.color = color;
            
            // Показываем ненайденных демонов
            for (let i = 0; i < boardSize * boardSize; i++) {
                if (board[i] === 1) {
                    const cell = boardElement.children[i];
                    cell.classList.add('revealed-demon');
                    cell.innerText = "👿";
                }
            }

            checkBtn.style.display = "none";
            restartBtn.style.display = "block";
        }

        function updateUI() {
            trapsElement.innerText = availableTraps;
            caughtElement.innerText = demonsCaught;
            if (currentRound <= 3) {
                roundElement.innerText = currentRound;
            }
        }

        window.onload = initGame;
    </script>
</body>
</html>
